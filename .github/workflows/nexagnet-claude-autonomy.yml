name: Nexagnet Autonomy caller

# Bot tự merge dùng chung (quy tắc xác định, không AI). Chạy sau khi Reviewer xong.
# Chỉ merge khi: Reviewer PASS đúng HEAD, ci xanh, PR Ready, không có nhãn needs-human,
# ruleset main hiệu lực, và PR không chạm đường dẫn nhạy cảm. Ngược lại: không merge.
# Cần secret App merge (mặc định AUTONOMY_MERGE_APP_ID/AUTONOMY_MERGE_APP_PRIVATE_KEY; xem docs/engineering/central-claude-autonomy.md).
# Ghim SHA 40 ký tự đã duyệt của .github; nâng cấp bằng PR do chủ duyệt.
on:
  workflow_run:
    workflows: [Nexagnet Reviewer caller]
    types: [completed]

permissions: {}

jobs:
  autonomy:
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    uses: nexagnet/.github/.github/workflows/claude-autonomy.yml@748866182dd34fcc0beff4621b94b7a7e0ba48b9
    with:
      reviewer_run_id: ${{ github.event.workflow_run.id }}
      required_jobs_csv: domain-tests,meta-check
      trusted_authors_csv: phungtienviet14-sketch
      sensitive_paths_regex: '^(ProjectSettings/|Packages/manifest\.json|Packages/packages-lock\.json)'
    secrets:
      AUTONOMY_MERGE_APP_ID: ${{ secrets.AUTOPILOT_APP_ID }}
      AUTONOMY_MERGE_APP_PRIVATE_KEY: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
