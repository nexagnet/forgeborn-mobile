name: Nexagnet Reviewer caller

# Gọi Reviewer dùng chung của nexagnet/.github sau khi workflow `ci` xanh trên PR.
# PR Draft được bỏ qua êm; PR chạm đường dẫn nhạy cảm (.github, CLAUDE.md...) bị từ chối.
# Ghim SHA 40 ký tự đã duyệt của .github; muốn nâng cấp thì sửa SHA qua PR do chủ duyệt.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  review:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.pull_requests[0] != null
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: write
    uses: nexagnet/.github/.github/workflows/claude-reviewer.yml@3dae6784d42e0476951fbae0b0493ebab96c547e
    with:
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      expected_head_sha: ${{ github.event.workflow_run.head_sha }}
      ci_run_id: ${{ github.event.workflow_run.id }}
      required_jobs_csv: domain-tests,meta-check
      trusted_authors_csv: phungtienviet14-sketch
      ignore_count_regex: '\.meta$'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
